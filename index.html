<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b63f6" />
  <title>BeRo</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--text:#111827;--muted:#6b7280;--blue:#0b63f6;--red:#e5484d;--line:#e5e7eb}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:88px}
    header{padding:20px 18px 14px;background:linear-gradient(180deg,#0b63f6 0%,#1b73ff 100%);color:white;border-radius:0 0 28px 28px}
    .top{display:flex;align-items:center;justify-content:space-between}
    .brand{font-size:27px;font-weight:800;letter-spacing:-1px}.pill{font-size:12px;background:rgba(255,255,255,.18);padding:7px 10px;border-radius:99px}
    .headline{margin-top:24px;font-size:22px;font-weight:750;line-height:1.3}.sub{opacity:.9;margin-top:6px;font-size:14px}
    main{padding:16px}.card{background:var(--card);border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 6px 24px rgba(17,24,39,.06)}
    .status{display:flex;gap:12px;align-items:center}.dot{width:12px;height:12px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 6px #dcfce7}
    .status b{font-size:17px}.small{color:var(--muted);font-size:13px;margin-top:3px}
    .alert{border-left:5px solid var(--red)} .alert h3{margin:0 0 6px;font-size:16px}.alert p{margin:0;color:#4b5563;font-size:14px;line-height:1.45}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quick{border:0;background:white;border-radius:18px;padding:18px;text-align:left;box-shadow:0 5px 20px rgba(17,24,39,.05)}
    .ico{font-size:24px}.quick b{display:block;margin-top:10px;font-size:15px}.quick span{font-size:12px;color:var(--muted)}
    .section-title{font-size:15px;font-weight:750;margin:20px 2px 10px}
    .place{display:flex;align-items:center;justify-content:space-between}.place strong{font-size:15px}.badge{background:#eef5ff;color:#0b63f6;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700}
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:72px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:max(8px,env(safe-area-inset-bottom))}
    nav button{border:0;background:transparent;font-size:11px;color:#6b7280}.active{color:var(--blue)!important;font-weight:700}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="top"><div class="brand">BeRo</div><div class="pill">한국어 ▾</div></div>
    <div class="headline">여행 중에도<br>안전정보를 한눈에</div>
    <div class="sub">내 위치 기반 재난·긴급 안내</div>
  </header>
  <main>
    <div class="card status">
      <div class="dot"></div>
      <div><b>현재 위치는 안전합니다</b><div class="small">마지막 확인: 방금 전</div></div>
    </div>

    <div class="card alert">
      <h3>⚠️ 주변 재난 알림</h3>
      <p>현재 긴급 대피가 필요한 알림은 없습니다. 발생 시 다국어로 즉시 안내합니다.</p>
    </div>

    <div class="section-title">빠른 메뉴</div>
    <div class="grid">
      <button class="quick" onclick="alert('주변 대피소를 검색합니다')"><div class="ico">🛟</div><b>대피소 찾기</b><span>가까운 안전지점</span></button>
      <button class="quick" onclick="alert('긴급 연락처를 표시합니다')"><div class="ico">📞</div><b>긴급 연락</b><span>경찰·소방·영사관</span></button>
      <button class="quick" onclick="alert('재난 지도를 엽니다')"><div class="ico">🗺️</div><b>재난 지도</b><span>위험지역 확인</span></button>
      <button class="quick" onclick="alert('오프라인 안전카드를 엽니다')"><div class="ico">📲</div><b>오프라인 카드</b><span>통신 끊겨도 확인</span></button>
    </div>

    <div class="section-title">내 주변</div>
    <div class="card place"><div><strong>현재 지역 안전도</strong><div class="small">위치 기반 종합 상태</div></div><div class="badge">정상</div></div>
    <div class="card place"><div><strong>가장 가까운 대피소</strong><div class="small">위치 권한 허용 후 표시</div></div><div class="badge">찾기</div></div>
  </main>
  <nav>
    <button class="active">⌂<br>홈</button><button>⚠<br>알림</button><button>⌖<br>지도</button><button>☰<br>더보기</button>
  </nav>
</div>
</body>
</html>
